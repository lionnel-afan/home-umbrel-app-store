version: "3.7"

services:
  postgresql:
    image: postgres:16.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg-umbrel-password
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
