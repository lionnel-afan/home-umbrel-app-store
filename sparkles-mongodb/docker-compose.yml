version: "3.7"

services:
  mongodb:
    image: mongo:7.0.5
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mdb-umbrel-password
    volumes:
      - ${APP_DATA_DIR}/data:/data/db
      - ${APP_DATA_DIR}/config:/data/configdb
    ports:
      - "27017:27017"
